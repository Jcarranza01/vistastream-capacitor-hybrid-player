name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run verify
      - run: npm run build

  pod-lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: pod lib lint VistaStreamHybridPlayer.podspec --allow-warnings --skip-tests
